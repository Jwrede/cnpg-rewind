name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./cmd/cnpg-rewind

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install kind
        run: |
          curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.30.0/kind-linux-amd64
          sudo install kind /usr/local/bin/kind
          kind version
          kubectl version --client
      - run: e2e/run.sh
      - name: Diagnostics
        if: failure()
        run: |
          kubectl get pods -A || true
          kubectl -n app get clusters,backups,volumesnapshots,pvc,pods -o wide || true
          kubectl -n app get clusters -o yaml || true
          kubectl get volumesnapshotcontents || true
          kubectl -n cnpg-system logs deployment/cnpg-controller-manager --tail=200 || true
          kubectl -n app describe backups || true

  e2e-objectstore:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install kind
        run: |
          curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.30.0/kind-linux-amd64
          sudo install kind /usr/local/bin/kind
          kind version
          kubectl version --client
      - run: e2e/objectstore.sh
